[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tableau-emprunt"
version = "0.1.0"
description = "Tableau d'amortissement d'un prêt : mensualités, intérêts, assurance, coût total et capacité d'emprunt"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Théo Pasquier" }]
keywords = ["prêt immobilier", "crédit", "tableau d'amortissement", "mensualité", "capacité d'emprunt", "France"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tableau-emprunt = "tableau_emprunt.__main__:main"

[project.urls]
Homepage = "https://github.com/TheoPSR01/tableau-emprunt"
Issues = "https://github.com/TheoPSR01/tableau-emprunt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_emprunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
